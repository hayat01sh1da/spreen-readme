<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="spreen-readme: an origami falcon stooping across an ink-blue stone, a stale README page drifting ahead of its dive and its lines left settled into order in its wake">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4a80"/>
      <stop offset="1" stop-color="#191d33"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="128" cy="128" r="118"/>
    </clipPath>
  </defs>

  <!-- ink-blue stone -->
  <circle cx="128" cy="128" r="118" fill="url(#stone)"/>

  <!-- chatoyant band sweeping across the stone -->
  <g clip-path="url(#round)">
    <rect x="-60" y="106" width="440" height="44" fill="#ffffff" opacity="0.08" transform="rotate(45 128 128)"/>
    <rect x="-60" y="122" width="440" height="12" fill="#ffffff" opacity="0.14" transform="rotate(45 128 128)"/>
  </g>

  <!-- the README left in the falcon's wake: a heading and its lines, flush and in order -->
  <g stroke="#dfe4f7" stroke-linecap="round" opacity="0.85">
    <line x1="52" y1="44" x2="80" y2="44" stroke-width="5"/>
    <line x1="52" y1="56" x2="102" y2="56" stroke-width="3.5"/>
    <line x1="52" y1="66" x2="94" y2="66" stroke-width="3.5"/>
  </g>

  <!-- the stale page ahead of the dive: ragged, unaligned lines fading out -->
  <g transform="rotate(8 196 168)">
    <rect x="174" y="142" width="44" height="52" rx="4" fill="#c8cfe8" opacity="0.88"/>
    <g stroke="#5a6396" stroke-width="3" stroke-linecap="round">
      <line x1="182" y1="156" x2="208" y2="156" opacity="0.8"/>
      <line x1="186" y1="166" x2="210" y2="166" opacity="0.7"/>
      <line x1="181" y1="176" x2="204" y2="176" opacity="0.6"/>
      <line x1="185" y1="186" x2="206" y2="186" opacity="0.45"/>
    </g>
  </g>

  <!-- a further page still drifting, further out of date -->
  <g transform="rotate(-12 214 122)" opacity="0.5">
    <rect x="200" y="104" width="28" height="36" rx="3" fill="#c8cfe8"/>
    <g stroke="#5a6396" stroke-width="2.5" stroke-linecap="round">
      <line x1="206" y1="115" x2="222" y2="115" opacity="0.7"/>
      <line x1="209" y1="124" x2="221" y2="124" opacity="0.5"/>
    </g>
  </g>

  <!-- ink dust of the lines already settled -->
  <g fill="#e8ebf8">
    <circle cx="168" cy="204" r="3" opacity="0.45"/>
    <circle cx="150" cy="214" r="2.5" opacity="0.35"/>
    <circle cx="182" cy="196" r="2" opacity="0.3"/>
    <circle cx="205" cy="210" r="1.5" opacity="0.25"/>
  </g>

  <!-- origami falcon in a stoop across the page, preened feathers trailing -->
  <g>
    <!-- trailing wing (far side) -->
    <polygon points="98,122 26,76 90,148" fill="#c3d4da"/>
    <!-- body: the dart of the dive -->
    <polygon points="190,190 82,90 110,64" fill="#f4f7f8"/>
    <!-- leading wing (near side) -->
    <polygon points="126,94 172,22 152,88" fill="#dde8ec"/>
    <!-- the falcon's eye -->
    <circle cx="170" cy="167" r="6" fill="#f0b429"/>
  </g>

  <!-- polished rim of the stone -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#a6aed6" stroke-opacity="0.55" stroke-width="4"/>
</svg>
